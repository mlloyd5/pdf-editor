[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf-editor"
version = "0.1.0"
description = "A free and open source PDF utility for Linux, macOS, and Windows."
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
dependencies = [
    "pikepdf>=9.0.0",
    "PyMuPDF>=1.24.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.7.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
    "pytest-qt>=4.4.0",
]

[project.scripts]
pdf-editor = "pdf_editor.cli:app"
pdf-editor-gui = "pdf_editor.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_editor"]

[tool.ruff]
src = ["src"]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
